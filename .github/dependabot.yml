---
# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # version updates: enabled / security updates: enabled
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # version updates: disabled (open-pull-requests-limit: 0) / security: enabled.
  # Scoped to the repo's real Go modules — there is no root go.mod, and the
  # inherited docker@cicd entry pointed at a cicd/ dir that never existed
  # (removed in IMPL-0016 Phase 5). tools/bedrock-keyctl is slated to move to
  # its own repo; drop its directory here when it leaves.
  - package-ecosystem: "gomod"
    directories:
      - "/tools/bedrock-keyctl"
      - "/modules/eks/cluster/test"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
