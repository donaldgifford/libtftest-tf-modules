---
# Path/branch auto-labels applied by .github/workflows/labeler.yml.
# Retargeted to the real tree in IMPL-0016 Phase 5 (the inherited cmd/pkg/
# collector/Makefile/.goreleaser globs referenced dirs that never existed here).

# Go lives only in the in-tree tool + the eks/cluster libtftest harness.
go:
  - changed-files:
      - any-glob-to-any-file: "tools/**/*.go"
      - any-glob-to-any-file: "modules/**/*.go"

dependencies:
  - changed-files:
      - any-glob-to-any-file: "**/go.mod"
      - any-glob-to-any-file: "**/go.sum"
      - any-glob-to-any-file: mise.toml

documentation:
  - changed-files:
      - any-glob-to-any-file: docs/**
      - any-glob-to-any-file: README.md

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

repo:
  - changed-files:
      - any-glob-to-any-file: justfile
      - any-glob-to-any-file: .docz.yaml
      - any-glob-to-any-file: .markdownlint.yaml
      - any-glob-to-any-file: .yamllint.yml
      - any-glob-to-any-file: .yamlfmt.yml
      - any-glob-to-any-file: .prettierrc.yaml
      - any-glob-to-any-file: "**/.tflint.hcl"
      - any-glob-to-any-file: "scripts/**"

# Branch-name prefixes.
feature:
  - head-branch: ["^feature", "feature"]
fix:
  - head-branch: ["^fix", "fix"]
chore:
  - head-branch: ["^chore", "chore"]
docs:
  - head-branch: ["^docs", "docs"]
security:
  - head-branch: ["^security", "security"]
