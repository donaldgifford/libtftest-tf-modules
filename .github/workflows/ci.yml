---
# $schema=https://schemastore.org/https://www.schemastore.org/github-action.json
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR / ref.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static gate (repo-wide, runs FIRST, gates everything) ──────────────────
  # terraform fmt + validate + tflint + terraform-docs across EVERY module
  # (ADR-0019). No plan/apply job runs until this passes, so nothing tests
  # against a tree that isn't formatted, valid, lint-clean, and doc-fresh.
  static:
    name: Static gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.5

      - name: just static
        # Authenticate tflint --init's GitHub plugin fetch (avoids the
        # unauthenticated 60/hr 403). The shared provider plugin-cache is set
        # inside scripts/static-check.sh.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just static

  # ── Change detection ──────────────────────────────────────────────────────
  # Runs only once the static gate is green. Computes the changed-module matrix
  # tiers (changed / community / pro) — all scoped to what the PR touched
  # (INV-0006 Q3a fan-out; the repo-wide coverage is the static gate above).
  detect:
    name: Detect changed modules
    needs: static
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.matrix.outputs.changed }}
      community: ${{ steps.matrix.outputs.community }}
      pro: ${{ steps.matrix.outputs.pro }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4.2.5

      - id: matrix
        name: Compute test matrix
        env:
          BASE_REF: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.base.sha
                || github.event.before }}
        run: |
          matrix="$(scripts/changed-modules.sh "${BASE_REF}")"
          {
            echo "changed=$(jq -c '.changed' <<<"${matrix}")"
            echo "community=$(jq -c '.community' <<<"${matrix}")"
            echo "pro=$(jq -c '.pro' <<<"${matrix}")"
          } >>"${GITHUB_OUTPUT}"

  # ── Plan tier (changed modules only) ───────────────────────────────────────
  # Plan-only `terraform test` per changed module. The static gate already
  # covered validate/lint/fmt/docs repo-wide, so this is just the plan test.
  # Skipped when nothing changed (docs-only PR → changed == []).
  plan:
    name: Plan (${{ matrix.module }})
    needs: detect
    if: needs.detect.outputs.changed != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.changed) }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.5

      - name: just tf test ${{ matrix.module }}
        run: just tf test ${{ matrix.module }}

  # ── Community apply tier (changed modules that ship tests-localstack/) ──────
  # Backed by the LocalStack *Pro* image: most tests-localstack/ suites (eks×4,
  # efs, rds/serverless) exercise Pro-only AWS APIs that 501 on the Community
  # image — only network/vpc-lookup is genuinely token-free. Runs only after the
  # plan tier is green. Skipped on fork PRs (the auth token is not exposed to
  # forks — INV-0006 F5 / ADR-0018 §5).
  #
  # Master toggle: both apply tiers require a working LocalStack Pro license
  # (LOCALSTACK_AUTH_TOKEN). They are OFF until the repository variable
  # CI_RUN_LOCALSTACK_APPLY == 'true' (IMPL-0016 Phase 6): the token could not be
  # activated headless, so the tiers are gated off to unblock merge on the green
  # static/plan gates. Flip on — with no code change — once the token activates:
  #   gh variable set CI_RUN_LOCALSTACK_APPLY --repo <owner>/<repo> --body true
  # `ci-gate` tolerates the skipped tiers; when enabled they become required again.
  test-localstack:
    name: LocalStack apply (${{ matrix.module }})
    needs: [detect, plan]
    if: >-
      needs.detect.outputs.community != '[]'
      && vars.CI_RUN_LOCALSTACK_APPLY == 'true'
      && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Cap concurrent LocalStack Pro license activations (each job activates the
      # shared auth token) to stay within the CI seat limit.
      max-parallel: 4
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.community) }}
    services:
      localstack:
        image: localstack/localstack-pro:2026.07.2
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.5

      - name: just tf test-localstack ${{ matrix.module }}
        run: just tf test-localstack ${{ matrix.module }}

  # ── Pro apply tier (changed modules that ship tests-localstack-pro/) ────────
  # The RDS quartet's real Aurora/instance applies boot LocalStack Pro's embedded
  # Postgres. As a `services:` container there is no host bind-mount, so the
  # macOS Docker-Desktop `initdb` ownership gotcha (the named-volume workaround)
  # cannot occur on the Linux runner (INV-0006 F4). Runs after the plan tier;
  # gated by the same CI_RUN_LOCALSTACK_APPLY toggle (see the community tier);
  # skipped on fork PRs.
  test-localstack-pro:
    name: LocalStack Pro apply (${{ matrix.module }})
    needs: [detect, plan]
    if: >-
      needs.detect.outputs.pro != '[]'
      && vars.CI_RUN_LOCALSTACK_APPLY == 'true'
      && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.pro) }}
    services:
      localstack:
        image: localstack/localstack-pro:2026.07.2
        ports:
          - 4566:4566
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.5

      - name: just tf test-localstack-pro ${{ matrix.module }}
        run: just tf test-localstack-pro ${{ matrix.module }}

  # ── README coverage-matrix drift guard (ADR-0018 §4) ───────────────────────
  # `just readme --check` fails if the module × test-tier table (and version
  # column) in README.md is stale. Needs full history + tags because
  # gen-readme.sh derives each module's version from `git tag --contains`.
  readme-check:
    name: README matrix drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v4.2.5

      - name: just readme --check
        run: just readme --check

  # ── Aggregate gate (the single required status check) ──────────────────────
  # A dynamic matrix cannot be enumerated in branch protection, so this one job
  # gates the merge: it fails if any needed job failed/was cancelled and passes
  # when apply/plan matrices are legitimately empty/skipped.
  ci-gate:
    name: CI gate
    needs: [static, detect, plan, test-localstack, test-localstack-pro, readme-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_LOCALSTACK_RESULT: ${{ needs.test-localstack.result }}
          TEST_LOCALSTACK_PRO_RESULT: ${{ needs.test-localstack-pro.result }}
          README_CHECK_RESULT: ${{ needs.readme-check.result }}
        run: |
          failed=0
          for job in STATIC DETECT PLAN TEST_LOCALSTACK TEST_LOCALSTACK_PRO README_CHECK; do
            varname="${job}_RESULT"
            result="${!varname}"
            if [[ "${result}" == "failure" || "${result}" == "cancelled" ]]; then
              echo "::error::required CI job '${job}' concluded '${result}'"
              failed=1
            else
              echo "ok: ${job} = ${result}"
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi
          echo "All required CI jobs passed (or were legitimately skipped)."
