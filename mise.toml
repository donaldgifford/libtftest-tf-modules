# Every tool is pinned to an exact version — no `latest` anywhere.
#
# `latest` is not free: mise resolves it over the network on every run by
# listing the upstream versions, and each of those calls has a 20s ceiling
# (MISE_FETCH_REMOTE_VERSIONS_TIMEOUT). One of them timing out against
# proxy.golang.org took `mise install` down mid-CI, which failed the static
# gate before it ran a single check. Pinned versions skip version listing
# entirely, so that failure mode is gone — and CI and local machines are
# guaranteed to run the same binaries.
#
# Keeping them current is Renovate's job: every line carries a
# `# renovate:` annotation for the custom regex manager in renovate.json
# (mise's own manager is disabled there). A pin with no annotation is
# invisible to Renovate and will silently rot — always add one.

[tools]

# Go
# renovate: datasource=github-tags depName=golang/go
go = "1.26.5"
# renovate: datasource=github-releases depName=segmentio/golines
golines = "0.13.0"
# renovate: datasource=go depName=golang.org/x/tools
"go:golang.org/x/tools/cmd/goimports" = "0.48.0"

# Terraform
# renovate: datasource=github-releases depName=hashicorp/terraform
terraform = "1.15.8"
# renovate: datasource=github-releases depName=gruntwork-io/terragrunt
terragrunt = "0.99.5"
# renovate: datasource=github-releases depName=terraform-linters/tflint
tflint = "0.64.0"
# renovate: datasource=github-releases depName=terraform-docs/terraform-docs
terraform-docs = "0.24.0"

# Repo utilities
# renovate: datasource=github-releases depName=casey/just
just = "1.58.0"
# renovate: datasource=github-releases depName=localstack/lstk
"github:localstack/lstk" = "0.21.0"

# Formatters and linters
# renovate: datasource=github-releases depName=DavidAnson/markdownlint-cli2
markdownlint-cli2 = "0.18.1"
# renovate: datasource=github-releases depName=google/yamlfmt
yamlfmt = "0.21.0"
# renovate: datasource=github-tags depName=adrienverge/yamllint
yamllint = "1.38.0"
# renovate: datasource=npm depName=prettier
prettier = "3.9.6"

# tools
# renovate: datasource=github-releases depName=mikefarah/yq
yq = "4.53.3"
# jq tags releases as `jq-1.8.2`; renovate.json carries an extractVersion
# packageRule to pull the bare version out of that.
# renovate: datasource=github-releases depName=jqlang/jq
jq = "1.8.2"
# renovate: datasource=github-releases depName=donaldgifford/docz
"github:donaldgifford/docz" = "1.1.0"


# Release tools
# renovate: datasource=github-releases depName=golangci/golangci-lint
golangci-lint = "2.12.2"

# Security
# renovate: datasource=go depName=golang.org/x/vuln
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
# Policy-as-code (IMPL-0019 Phase 4): the credential no-leak gate under
# policy/ runs via conftest in scripts/static-check.sh.
# renovate: datasource=github-releases depName=open-policy-agent/conftest
conftest = "0.69.0"

# Compliance
# renovate: datasource=go depName=github.com/google/go-licenses
"go:github.com/google/go-licenses" = "2.0.1"
